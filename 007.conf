# Per-project config for 007 (sourced by the `007` launcher + the `M` handler).
# THIS is the only file a consuming repo supplies. Uses `=` (assign-if-unset) so
# env overrides win.
# ---- gefion (public repo) ----

# Build the cached dependency venv once into the shared /opt/venv volume (first run).
: "${SANDBOX_SETUP=python -m venv /opt/venv && /opt/venv/bin/pip install -q -U pip && /opt/venv/bin/pip install -q \".[dev,ml_extended,ui]\"}"

# The gate: how a worker validates its work (run inside the container). One test
# false-negatives in the 007 box for a reason unrelated to any change, so it's
# deselected HERE (gefion CI still runs the full suite on the PR):
#   - test_connection_with_default_url: the box uses a per-worker DB, not the default URL.
# (The test_resource_aware_limiter_periodic_checking deselect was dropped once #226's
# monotonic-clock fix landed on main in #229 — the test is deterministic now.)
: "${SANDBOX_TEST=PYTHONPATH=/workspace/src /opt/venv/bin/python -m pytest -q --deselect tests/test_cli_helpers.py::TestDBConnection::test_connection_with_default_url}"

# Gate wall-clock cap. The full suite runs ~15x slower in this resource-limited Docker VM
# than locally (~30 min vs ~2 min: DB round-trips cross the bridge, CPU/RAM constrained),
# so the 900s default times out at ~half the suite — a false tests_passed=false. 2400s lets
# it complete. (CI on the PR is the authoritative full-suite gate; this is the early filter.
# The real cure for the slowness is more Docker VM resources or a narrower box gate.)
: "${SANDBOX_GATE_TIMEOUT=2400}"

# Worker wall-clock cap. gefion's suite re-inits a per-worker TimescaleDB on every
# pytest run, so give the agent headroom above the 1200s default (the field protocol
# also tells agents to iterate on narrow tests and leave the full suite to the gate).
: "${SANDBOX_AGENT_TIMEOUT=1800}"

# Per-worker DB URL — \${TASK} is unique per worker so parallel pytest runs don't
# collide (gefion derives <db>_test). Host dev Postgres reached via host.docker.internal.
# %TASK% is replaced with the worker's slug (brace-free to avoid nested-} parsing).
: "${SANDBOX_DB_URL=postgresql://gefion:gefionpass@host.docker.internal:6432/gefion_ws_%TASK%}"
: "${SANDBOX_DB_PORT=6432}"

# Extra egress the worker may reach (api.anthropic.com + the DB host are always allowed).
# Public repo → NO github here: the supervisor injects issue context, so the worker
# needs neither a GitHub credential NOR github network. Smallest exfil surface.
: "${SANDBOX_EGRESS_EXTRA=}"

# Supervisor policy.
: "${SANDBOX_PR_BASE=main}"
: "${SANDBOX_SIGN=1}"

export SANDBOX_SETUP SANDBOX_TEST SANDBOX_GATE_TIMEOUT SANDBOX_AGENT_TIMEOUT SANDBOX_DB_URL SANDBOX_DB_PORT \
       SANDBOX_EGRESS_EXTRA SANDBOX_PR_BASE SANDBOX_SIGN
